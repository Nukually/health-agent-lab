name: health-agent-lab
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo_local_only
      POSTGRES_DB: health_agent_lab
    ports:
      - '127.0.0.1:15433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
